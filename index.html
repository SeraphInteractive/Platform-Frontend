<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Stairway - Community Voting & Production Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('mcs_theme');
        if (theme !== 'light') document.documentElement.setAttribute('data-theme', 'dark');
        var sz = localStorage.getItem('mcs_font_size');
        if (sz) document.documentElement.style.fontSize = sz + 'px';
        var compactness = localStorage.getItem('mcs_compactness');
        if (compactness) document.documentElement.setAttribute('data-compactness', compactness);
        var highContrast = localStorage.getItem('mcs_high_contrast');
        if (highContrast === 'true') document.documentElement.setAttribute('data-high-contrast', 'true');
        var reducedMotion = localStorage.getItem('mcs_reduced_motion');
        if (reducedMotion === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
